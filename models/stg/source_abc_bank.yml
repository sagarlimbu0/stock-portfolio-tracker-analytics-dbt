version: 2
sources:
    - name: bank_co
      database: PORTFOLIO_TRACKER
      schema: SOURCE_DATA
      tables:
        - name: MPK_BANK_POSITION
          description: >
            The staging table that holds banking position extracted from CSV import
        
          columns:
            - name: ACCOUNTID
              description: Refers to code symbol for account at ABC Bank
              tests:
                - not_null
            - name: SYMBOL
              description: Symbol of security at ABC Bank
              tests:
                - unique
                - not_null
            - name: DESCRIPTION
              description: Name of security in descriptive information at ABC Bank
              tests:
                - not_null
            - name: EXCHANGE
              description: >
                    The short name or code of the exchange where the security is traded
              tests:
                - not_null
            - name: REPORT_DATE
              description: >
                    The date of the report was extracted by ABC Bank. We consider this position to
                    be this date forward, until a change is implemented
              tests:
                - not_null
            - name: QUANTITY
              description: >
                    The number of securities we hold in the portfolio at ABC Bank at the Report Date.
              tests:
                - not_null
            - name: COST_BASE
              description: >
                    The cost we paid for the securities that we hold in the portfolio at ABC Bank at
                    the report date.
              tests:
                - not_null
            - name: POSITION_VALUE
              description: >
                    The value of the securities in the portfolio at ABC Bank on the Report Date. To calculate
                    the position profit.
              tests:
                - not_null        
            - name: CURRENCY
              description: >
                    The currency for the monetary amounts of the position. Conversion required for other positions
                    if exchanged in different currency
              tests:
                - not_null
                